<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>因子报告 · ECharts</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #1a2b3c;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }
        .container { max-width: 1280px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .back-link {
            color: #5b6f86;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 14px;
            border: 1px solid #cdd6e0;
            border-radius: 20px;
        }
        .back-link:hover { background: #e5eaf0; color: #0b1e33; }
        .report-title { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; color: #0b1e33; }
        .report-meta { font-size: 13px; color: #5b6f86; }
        .report-meta strong { color: #0b1e33; font-weight: 500; }

        .range-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .range-btn {
            padding: 6px 16px;
            font-size: 13px;
            font-family: inherit;
            color: #5b6f86;
            background: #ffffff;
            border: 1px solid #cdd6e0;
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .range-btn:hover { background: #e5eaf0; color: #0b1e33; }
        .range-btn.active { background: #2a78d6; border-color: #2a78d6; color: #ffffff; }

        .chart-wrapper {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf2;
        }
        #chart { width: 100%; }

        .message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #5b6f86;
            font-size: 15px;
            gap: 12px;
            text-align: center;
        }
        .message.error { color: #d32f2f; }
        code { background: #eef2f7; padding: 2px 8px; border-radius: 4px; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .report-title { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="back-link">← 返回</a>
            <span class="report-title" id="reportTitle">加载中...</span>
        </div>
        <div class="report-meta">
            <strong id="factorCount">--</strong> 个因子 ·
            <strong id="dateRange">--</strong>
        </div>
    </div>

    <!-- 时间范围切换 -->
    <div class="range-bar" id="rangeBar">
        <button class="range-btn" data-count="244">近1年</button>
        <button class="range-btn" data-count="488">近2年</button>
        <button class="range-btn" data-count="732">近3年</button>
        <button class="range-btn" data-count="976">近4年</button>
        <button class="range-btn" data-count="0">全部</button>
    </div>

    <div class="chart-wrapper">
        <div id="chart"><div class="message">⏳ 正在加载数据...</div></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const asset = params.get('asset') || 'au';
    const ASSET_NAMES = { 'au': '黄金', 'sc': '原油', 'stock': '股指', 'treasury': '国债' };
    const ASSET_FILES = { 'au': 'au_all_alphas', 'sc': 'sc_all_alphas',
                          'stock': 'stock_index_all_alphas', 'treasury': 'treasury_all_alphas' };
    const displayName = ASSET_NAMES[asset] || asset;

    document.title = `${displayName} 因子报告`;
    document.getElementById('reportTitle').textContent = `${displayName} · All Alphas`;

    const dataUrl = `data/${ASSET_FILES[asset] || asset + '_all_alphas'}.json`;
    const chartDom = document.getElementById('chart');
    const showMessage = (html, isError) => {
        chartDom.innerHTML = `<div class="message ${isError ? 'error' : ''}">${html}</div>`;
    };

    let chart = null;
    let cachedData = null;
    let currentPoints = 976; // 当前显示窗口（数据点数）

    // 布局断点：> 768px 两列，否则单列
    const layoutCols = () => (window.innerWidth > 768 ? 2 : 1);

    // 按数据点数设置显示窗口（0 = 全部），作用于所有面板的滑块
    const setRange = points => {
        currentPoints = points;
        if (!chart || !cachedData) return;
        const total = cachedData.index.length;
        const start = (points <= 0 || points >= total)
            ? 0 : Math.max(0, 100 - (points / total) * 100);
        const zoomCount = Math.ceil(cachedData.columns.length) * 2; // 每面板 inside + slider
        chart.dispatchAction({
            type: 'dataZoom',
            batch: [...Array(zoomCount).keys()].map(idx => ({ dataZoomIndex: idx, start, end: 100 })),
        });
    };

    // 计算布局并渲染（列数变化时重建整个 option）
    function render() {
        const { columns, index, data: values } = cachedData;
        const cols = layoutCols();
        const n = columns.length;
        const rows = Math.ceil(n / cols);

        // 记录各面板当前缩放窗口，重排后原样恢复
        let prevZoom = null;
        if (chart) {
            prevZoom = chart.getOption().dataZoom.map(d => ({ start: d.start, end: d.end }));
        }

        const TITLE_H = 20;    // 因子名称行高
        const SLIDER_H = 24;   // 每个面板专属时间滑块行高
        const PANEL_GAP = 48;  // 面板行间距
        const COL_GAP = 56;    // 面板列间距
        const MARGIN = 16;
        const TOP_PAD = 10;
        const BOTTOM_PAD = 10;

        const W = chartDom.clientWidth;
        const colW = (W - MARGIN * 2 - COL_GAP * (cols - 1)) / cols;
        // 每个面板按 宽:高 = 2:1 取高（另加 x 轴标签空间）
        const PANEL_H = Math.round(colW / 2) + 20;

        // 容器高度随行数变化（每行 = 名称 + 绘图 + 滑块）
        chartDom.style.height =
            TOP_PAD + rows * (PANEL_H + TITLE_H + SLIDER_H)
            + (rows - 1) * PANEL_GAP + BOTTOM_PAD + 'px';
        if (!chart) {
            chartDom.innerHTML = ''; // 清掉加载提示
            chart = echarts.init(chartDom);
        }
        chart.resize();

        const grids = [], titles = [], xAxes = [], yAxes = [], series = [], dataZoom = [];
        const LINE = '#2a78d6';    // 普通因子
        // 前两个核心因子单独着色：多空仓位（橙）、综合因子（青绿）
        const HL_COLORS = ['#eb6834', '#1baf7a'];

        columns.forEach((col, i) => {
            const row = Math.floor(i / cols);
            const colIdx = i % cols;
            const top = TOP_PAD + row * (PANEL_H + TITLE_H + SLIDER_H + PANEL_GAP);
            // 最后一行落单的面板水平居中，避免右侧留白
            const lastLone = (i === n - 1) && (n % cols === 1);
            const left = lastLone
                ? Math.round((W - colW) / 2)
                : MARGIN + colIdx * (colW + COL_GAP);
            const color = HL_COLORS[i] || LINE;

            grids.push({
                left: left, width: colW,
                top: top + TITLE_H, height: PANEL_H,
                containLabel: true,
            });
            titles.push({
                text: col,
                left: left + 2, top: top - 8,
                textStyle: { fontSize: 12, fontWeight: 600, color: '#0b1e33' },
            });
            xAxes.push({
                type: 'category',
                data: index,
                gridIndex: i,
                // 每个面板都显示日期，hideOverlap 自动抽稀
                axisLabel: { show: true, color: '#8b9bb0', fontSize: 10, hideOverlap: true },
                axisLine: { lineStyle: { color: '#e9edf2' } },
                axisTick: { show: false },
            });
            // y 轴固定量程：无负值取 [0,1]，有负值取 [-1,1]，刻度 0.5 步长
            const colData = values.map(row => row[i]);
            const hasNeg = colData.some(v => v != null && v < 0);
            yAxes.push({
                type: 'value',
                gridIndex: i,
                min: hasNeg ? -1 : 0,
                max: 1,
                interval: 0.5,
                splitLine: { lineStyle: { color: '#f0f2f5' } },
                axisLabel: { color: '#8b9bb0', fontSize: 10 },
            });

            // 每个面板专属：时间滑块 + 滚轮缩放（互不影响）
            dataZoom.push(
                { type: 'inside', xAxisIndex: [i], start: 0, end: 100 },
                {
                    type: 'slider',
                    xAxisIndex: [i],
                    left: left, width: colW,
                    top: top + TITLE_H + PANEL_H + 2, height: 18,
                    borderColor: '#e9edf2',
                    fillerColor: 'rgba(42,120,214,0.12)',
                    handleStyle: { color: '#cdd6e0' },
                    showDetail: false,
                    labelFormatter: () => '',
                },
            );
            series.push({
                name: col,
                type: 'line',
                xAxisIndex: i,
                yAxisIndex: i,
                data: colData,
                symbol: 'none',
                lineStyle: { width: HL_COLORS[i] ? 3 : 2.5, color: color },
                emphasis: { focus: 'series' },
            });

            // 最新值标注（圆点 + 数值）
            const lastVal = values[values.length - 1][i];
            series.push({
                name: col + '_last',
                type: 'scatter',
                xAxisIndex: i,
                yAxisIndex: i,
                data: lastVal == null ? [] : [[index[index.length - 1], lastVal]],
                symbol: 'circle',
                symbolSize: 7,
                itemStyle: { color: color, borderColor: '#ffffff', borderWidth: 1.5 },
                label: {
                    show: true,
                    position: 'left',
                    distance: 8,
                    formatter: lastVal == null ? '' : Number(lastVal).toFixed(2),
                    fontSize: 11,
                    fontWeight: 600,
                    color: '#0b1e33',
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#e9edf2',
                    borderWidth: 1,
                    padding: [2, 6],
                    borderRadius: 4,
                },
                emphasis: { scale: false },
                z: 10,
            });
        });

        chart.setOption({
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'line', lineStyle: { color: '#cdd6e0' } },
                // 只显示当前面板那条线的数值（过滤掉最新值圆点）
                formatter: params => {
                    const p = params.find(item => item.seriesType === 'line');
                    if (!p) return '';
                    const val = p.value == null ? '-' : Number(p.value).toFixed(3);
                    return `<div style="font-weight:600;margin-bottom:2px;">${p.axisValueLabel}</div>
                        <div>${p.marker} ${val}</div>`;
                },
            },
            title: titles,
            grid: grids,
            xAxis: xAxes,
            yAxis: yAxes,
            series: series,
            dataZoom: dataZoom,
        }, true);

        // 恢复缩放窗口：重排前有就原样恢复，否则应用默认范围
        if (prevZoom) {
            chart.dispatchAction({
                type: 'dataZoom',
                batch: prevZoom.map((z, idx) => ({ dataZoomIndex: idx, start: z.start, end: z.end })),
            });
        } else {
            setRange(currentPoints);
        }
    }

    fetch(dataUrl)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        })
        .then(data => {
            const columns = data.columns;
            const index = data.index;
            if (!columns || !columns.length) throw new Error('数据为空');

            // 元信息
            document.getElementById('factorCount').textContent = columns.length;
            document.getElementById('dateRange').textContent =
                `${index[0]} ~ ${index[index.length - 1]}`;

            cachedData = data;
            render();

            // 范围按钮
            const rangeBar = document.getElementById('rangeBar');
            rangeBar.addEventListener('click', e => {
                const btn = e.target.closest('.range-btn');
                if (!btn) return;
                rangeBar.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setRange(Number(btn.dataset.count));
            });
            // 初始默认：最近 4 年（数据不足则显示全部）
            const defaultBtn = (976 < index.length)
                ? rangeBar.querySelector('[data-count="976"]')
                : rangeBar.querySelector('[data-count="0"]');
            defaultBtn.classList.add('active');

            // 窗口变化：面板几何尺寸依赖像素宽度，必须整体重排（150ms 防抖）
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { if (chart) render(); }, 150);
            });
        })
        .catch(error => {
            console.error('加载失败:', error);
            const hint = window.location.protocol === 'file:'
                ? '<br>⚠️ file:// 协议无法加载本地 JSON，请用 HTTP 服务器打开（如 VS Code Live Server）'
                : `<br>请确认 <code>${dataUrl}</code> 存在且格式正确`;
            showMessage(`<div style="font-size:32px;">⚠️</div><strong>数据加载失败</strong>
                <div>${error.message}${hint}</div>`, true);
        });
</script>
</body>
</html>
